name: CD

# Solo se ejecuta por cambios incorporados a main. Un pull_request NO dispara este workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  # 1) Pruebas
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  # 2) Construir y publicar la imagen (etiquetada con el SHA del commit)
  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/libros-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/libros-api:latest

  # 3) Desplegar en EC2 (solo si las pruebas y la publicación pasaron)
  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      EC2_SG_ID: ${{ secrets.EC2_SG_ID }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/libros-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      # El puerto 22 de EC2 solo acepta tu IP. Para que el runner pueda entrar,
      # se abre su IP de forma temporal y se cierra siempre al final.
      - name: Abrir SSH temporalmente para el runner
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      - name: Preparar llave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Desplegar (con health check y rollback)
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' EXPECTED_COMMIT='${{ github.sha }}' bash -s" < deploy/deploy.sh

      - name: Verificación pública
        run: |
          curl -fsS "http://$EC2_HOST/health" | tee salida.json
          grep -q '${{ github.sha }}' salida.json
          curl -fsS "http://$EC2_HOST/libros" > /dev/null
          echo "Despliegue verificado"

      - name: Cerrar SSH del runner
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$EC2_SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" || true
          fi
